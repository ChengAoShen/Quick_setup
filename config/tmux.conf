set -g escape-time 10
set -g mouse on
set -g focus-events on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h
bind - split-window -v

bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"

# Let programs inside tmux talk to the outer terminal directly:
# image protocols, OSC 52 clipboard, shell integration.
set -g allow-passthrough on

# Copy to the outer terminal's clipboard (OSC 52), also when a program
# inside asks, e.g. Neovim yanking to "+.
set -g set-clipboard on

set -g extended-keys
set -g extended-keys-format csi-u

# Status bar only over SSH, where sessions outlive the connection
# and there are usually several. Locally it would say nothing useful.
set -g status-style "bg=default"
set -g status-left  " #[bold]#S#[default] "
set -g status-right " %Y-%m-%d %H:%M "
set -g status-justify centre
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g status on' 'set -g status off'
